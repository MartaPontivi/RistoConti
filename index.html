<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RistoConti</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    h2 {
      font-size: 27px;
      margin-top: 28px;
      margin-bottom: 12px;
      text-align: left;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =========================
       TAVOLI
    ========================= */

    #tables {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: 25px auto;
    }

    #tables button {
      min-height: 78px;
      border: 0;
      border-radius: 15px;
      background: white;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 2px 7px rgba(0,0,0,0.14);
    }

    #tables button:active {
      transform: scale(0.97);
    }


    /* =========================
       SCHEDE
    ========================= */

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MENU
    ========================= */

    #drinks,
    #food,
    #desserts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 74px;
      padding: 10px 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
    }

    .menu-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .menu-name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.15;
    }

    .menu-price {
      margin-top: 4px;
      font-size: 17px;
    }

    .menu-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .menu-btn,
    .qty-button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      background: #e5e5e5;
      font-size: 28px;
      font-weight: bold;
    }

    .menu-btn:active,
    .qty-button:active {
      transform: scale(0.94);
    }

    .menu-qty {
      min-width: 30px;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
    }


    /* =========================
       CONTO
    ========================= */

    .order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .order-row:last-child {
      border-bottom: 0;
    }

    .order-name {
      flex: 1;
      text-align: left;
      font-size: 18px;
      font-weight: bold;
    }

    .order-price {
      min-width: 75px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
    }


    /* =========================
       TOTALE
    ========================= */

    .total-card {
      margin-top: 22px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      font-size: 33px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MOBILE PICCOLO
    ========================= */

    @media (max-width: 390px) {

      body {
        padding: 8px;
      }

      .menu-name {
        font-size: 18px;
      }

      .menu-price {
        font-size: 16px;
      }

      .menu-btn,
      .qty-button {
        width: 44px;
        height: 44px;
        font-size: 25px;
      }

      .menu-controls {
        gap: 5px;
      }

      .menu-qty {
        min-width: 26px;
        font-size: 21px;
      }

    }

  </style>
</head>

let touchStartY = 0;

document.addEventListener(
  "touchstart",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    touchStartX = touch.screenX;
    touchStartY = touch.screenY;
  },
  { passive: true }
);

document.addEventListener(
  "touchend",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    const distanceX =
      touch.screenX - touchStartX;

    const distanceY =
      Math.abs(
        touch.screenY - touchStartY
      );

    if (
      distanceX > 100 &&
      distanceX > distanceY * 1.5
    ) {

      location.reload();

    }
  },
  { passive: true }
);


/* =========================================

async function renderTables() {

  container.innerHTML = "";

  const { data, error } =
    await supabaseClient
      .from("ristoconti_tables")
      .select(
        "table_number, covers, order_data, extras"
      )
      .order(
        "table_number",
        { ascending: true }
      );

  if (error) {

    console.error(
      "Errore caricamento tavoli:",
      error
    );

  }

  const tablesData = data || [];

  for (let i = 1; i <= 40; i++) {

    const savedTable =
      tablesData.find(
        table =>
          Number(table.table_number) === i
      );

    const covers =
      Number(savedTable?.covers || 0);

    const savedOrder =
      savedTable?.order_data || {};

    const savedExtras =
      Array.isArray(savedTable?.extras)
        ? savedTable.extras
        : [];

    const hasProducts =
      Object.values(savedOrder)
        .some(
          qty => Number(qty) > 0
        );

    const hasExtras =
      savedExtras.some(
        amount => Number(amount) > 0
      );

    const occupied =
      covers > 0 ||
      hasProducts ||
      hasExtras;

    let tableTotal =
  covers * 2;

Object.keys(savedOrder)
  .forEach(index => {

    const item =
      menu[index];

    const qty =
      Number(savedOrder[index] || 0);

    if (item && qty > 0) {
      tableTotal +=
        item.price * qty;
    }

  });

savedExtras.forEach(amount => {

  tableTotal +=
    Number(amount || 0);

});


    const button =
      document.createElement("button");


if (occupied) {

    "#bfe8c2";

  button.style.border =

        font-weight:bold;
      "

    </div>

    <div

        margin-top:6px;
        font-size:15px;
        font-weight:normal;
      "
    >
      ${covers}
      ${covers === 1 ? "coperto" : "coperti"}
    </div>

    <div
      style="
        margin-top:5px;
        font-size:22px;
        font-weight:bold;
      "
    >
      € ${tableTotal.toFixed(2)}
    </div>
  `;

}
    else {

      button.style.background =
        "#e8e8e8";

      button.style.border =
        "2px solid #d0d0d0";

      button.innerHTML = `
        <div>
          Tavolo ${i}
        </div>

        <div
          style="
            margin-top:6px;
            font-size:14px;
            font-weight:normal;
          "
        >
          Libero
        </div>
      `;

    }


    button.onclick = () => {
      openTable(i);
    };


    container.appendChild(button);

  }

}

renderTables();

    /* =========================================
       CARICA TAVOLO
    ========================================= */

    async function loadTableFromSupabase(
      tableNumber
    ) {

      const { data, error } =
        await supabaseClient
          .from("ristoconti_tables")
          .select(
            "covers, order_data, extras"
          )
          .eq(
            "table_number",
            tableNumber
          )
          .single();


      if (error) {

        console.error(
          "Errore caricamento tavolo:",
          error
        );

        return {
          covers: 0,
          order: {},
          extras: []
        };

      }


      return {

        covers:
          Number(data.covers || 0),

        order:
          data.order_data || {},

        extras:
          Array.isArray(data.extras)
            ? data.extras
            : []

      };

    }


    /* =========================================
       SALVA TAVOLO
    ========================================= */

    async function saveTableToSupabase() {

      if (!currentTable) {
        return;
      }


      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      const { error } =
        await supabaseClient
          .from("ristoconti_tables")
          .update({

            covers: covers,

            order_data: order,

            extras: extras,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "table_number",
            currentTable
          );


      if (error) {

        console.error(
          "Errore salvataggio tavolo:",
          error
        );

      }

    }

  if (!currentTable) {

  }

  const confirmed = confirm(

  const { error } = await supabaseClient

    /* =========================================
       COPERTI
    ========================================= */

      const input =
        document.getElementById(
          "covers"
        );

      const display =
        document.getElementById(
          "coversDisplay"
        );


      let covers =
        Number(input.value || 0);


      covers += amount;


      if (covers < 0) {
        covers = 0;
      }


      input.value = covers;

      display.textContent = covers;


      renderOrder();

    }

if (

) {

}

else if (item.name === "Bibita") {

}

else if (

else if (

    /* =========================================
       AGGIUNGI PRODOTTO
    ========================================= */

    function addItem(index) {

      if (!order[index]) {

        order[index] = 0;

      }


      order[index]++;


      renderMenu();

      renderOrder();

    }


    /* =========================================
       TOGLI PRODOTTO
    ========================================= */

    function removeItem(index) {

      if (!order[index]) {
        return;
      }


      order[index]--;


      if (order[index] <= 0) {

        delete order[index];

      }


      renderMenu();

      renderOrder();

    }


    /* =========================================
       ALTRO
    ========================================= */

    function addExtra() {

      const input =
        document.getElementById(
          "extraAmount"
        );


      const amount =
        Number(input.value);


      if (
        !amount ||
        amount <= 0
      ) {

        return;

      }


      extras.push(amount);


      input.value = "";


      renderOrder();

    }


    function removeExtra(index) {

      extras.splice(index, 1);

      renderOrder();

    }


    /* =========================================
       DIVIDI CONTO

    function changeSplit(amount) {

      const input =
        document.getElementById(
          "splitPeople"
        );

      const display =
        document.getElementById(
          "splitPeopleDisplay"
        );


      let people =
        Number(input.value || 1);


      people += amount;


      if (people < 1) {

        people = 1;

      }


      input.value = people;

      display.textContent = people;


      renderSplit();

    }

          "splitTotal"
        );


      if (!splitBox) {
        return;
      }


      splitBox.textContent =
        (total / people).toFixed(2);

    }


    /* =========================================
       CONTO
    ========================================= */

    function renderOrder() {

      const orderBox =
        document.getElementById(
          "order"
        );

      const totalBox =
        document.getElementById(
          "total"
        );


      if (
        !orderBox ||
        !totalBox
      ) {

        return;

      }


      orderBox.innerHTML = "";


      let total = 0;


      /* COPERTI */

      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      if (covers > 0) {

        const coverTotal =
          covers * 2;


        total += coverTotal;


        orderBox.innerHTML += `

          <div class="order-row">

            <span class="order-name">

              Coperto × ${covers}

            </span>


            <strong class="order-price">

              €${coverTotal.toFixed(2)}

            </strong>

          </div>

        `;

      }


      /* PRODOTTI */

      Object.keys(order)
        .forEach((index) => {

          const item =
            menu[index];

          const qty =
            Number(order[index]);


          if (
            !item ||
            qty <= 0
          ) {

            return;

          }


          const subtotal =
            item.price * qty;


          total += subtotal;


          orderBox.innerHTML += `

            <div class="order-row">

              <span class="order-name">

                ${item.name} × ${qty}

              </span>


              <strong class="order-price">

                €${subtotal.toFixed(2)}

              </strong>

            </div>

          `;

        });


      /* ALTRO */

      extras.forEach(
        (amount, index) => {

          amount =
            Number(amount);


          total += amount;


          orderBox.innerHTML += `

            <div class="order-row">

              <span class="order-name">
                Altro
              </span>


              <button
                onclick="removeExtra(${index})"
                style="
                  min-height:40px;
                  border:0;
                  border-radius:10px;
                  padding:7px 10px;
                  font-size:15px;
                "
              >
                Elimina
              </button>


              <strong class="order-price">

                €${amount.toFixed(2)}

              </strong>

            </div>

          `;

        });


      totalBox.textContent =
        total.toFixed(2);


      renderSplit();


      saveTableToSupabase();

    }

window.changeSettingCovers =
  function(tableNumber, amount) {

    const input =
      document.getElementById(
        `settingCovers${tableNumber}`
      );

    const display =
      document.getElementById(
        `settingCoversDisplay${tableNumber}`
      );

    if (!input || !display) {
      return;
    }

    let covers =
      Number(input.value || 0);

    covers += amount;

    if (covers < 0) {
      covers = 0;
    }

    input.value = covers;

    display.textContent = covers;

};


window.saveAllCovers =
  async function() {

    const button =
  document.querySelector(
    'button[onclick="saveAllCovers()"]'
  );
    

    if (button) {
      button.disabled = true;
      button.textContent =
        "Salvataggio...";
    }


    for (let i = 1; i <= 40; i++) {

      const covers =
        Number(
          document.getElementById(
            `settingCovers${i}`
          )?.value || 0
        );


      const { error } =
        await supabaseClient
          .from("ristoconti_tables")
          .update({
            covers: covers,
            updated_at:
              new Date().toISOString()
          })
          .eq(
            "table_number",
            i
          );


      if (error) {

        console.error(error);

        alert(
          `Errore nel salvataggio del Tavolo ${i}.\n\n` +
          error.message
        );

        if (button) {
          button.disabled = false;
          button.textContent =
            "✓ Salva coperti";
        }

        return;
      }

    }


    alert(
      "Coperti salvati correttamente."
    );

    location.reload();

};

    window.deleteMenuProduct =
  async function(id, name) {

    const confirmed =
      confirm(
        `Eliminare "${name}" dal menu?`
      );

    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("ristoconti_menu")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Errore durante l'eliminazione.\n\n" +
        error.message
      );

      return;
    }


    alert(
      `"${name}" eliminato.`
    );

    openMenuSettings();

};

window.addMenuProduct =
  async function() {

    const name =
      document
        .getElementById("newMenuName")
        ?.value
        .trim();

    const price =
      Number(
        document
          .getElementById("newMenuPrice")
          ?.value
      );

    const category =
      document
        .getElementById("newMenuCategory")
        ?.value;


    if (!name) {
      alert("Inserisci il nome.");
      return;
    }


    if (
      !price ||
      price <= 0
    ) {
      alert("Inserisci un prezzo valido.");
      return;
    }


    const { data: lastProduct } =
      await supabaseClient
        .from("ristoconti_menu")
        .select("sort_order")
        .order("sort_order", {
          ascending: false
        })
        .limit(1)
        .maybeSingle();


    const nextOrder =
      Number(
        lastProduct?.sort_order || 0
      ) + 1;


    const { error } =
      await supabaseClient
        .from("ristoconti_menu")
        .insert({
          name: name,
          price: price,
          category: category,
          sort_order: nextOrder,
          active: true
        });


    if (error) {

      console.error(error);

      alert(
        "Errore durante l'aggiunta.\n\n" +
        error.message
      );

      return;
    }


    alert(
      `${name} aggiunto al menu.`
    );

    openMenuSettings();

};

    window.closeBill = async function() {

  if (!currentTable) {
    alert("Nessun tavolo selezionato.");
    return;
  }

  const confirmed = confirm(
    "Chiudere il conto?\n\nVerranno cancellati coperti, prodotti e altri importi."
  );

  if (!confirmed) {
    return;
  }

  const tableToClose = currentTable;

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })
    .eq("table_number", tableToClose);

  if (error) {

    console.error(error);

    alert(
      "Non sono riuscito a chiudere il conto.\n\n" +
      error.message
    );

    return;
  }

  order = {};
  extras = [];

  alert("Conto chiuso. Tavolo liberato.");

  currentTable = null;

  location.reload();
};

    window.clearAllBills = async function() {

  const confirmed1 = confirm(
    "ATTENZIONE\n\nVuoi cancellare TUTTI i conti di tutti i tavoli?"
  );

  if (!confirmed1) {
    return;
  }

  const confirmed2 = confirm(
    "Sei sicuro?\n\nQuesta operazione azzererà tutti i 40 tavoli."
  );

  if (!confirmed2) {
    return;
  }

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })

  if (error) {

    console.error(error);

    alert(
      "Errore durante la cancellazione.\n\n" +
      error.message
    );

    return;
  }

  alert("Tutti i conti sono stati cancellati.");

  location.reload();
};
