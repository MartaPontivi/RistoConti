<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RistoConti</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    h2 {
      font-size: 27px;
      margin-top: 28px;
      margin-bottom: 12px;
      text-align: left;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =========================
       TAVOLI
    ========================= */

    #tables {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: 25px auto;
    }

    #tables button {
      min-height: 78px;
      border: 0;
      border-radius: 15px;
      background: white;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 2px 7px rgba(0,0,0,0.14);
    }

    #tables button:active {
      transform: scale(0.97);
    }


    /* =========================
       SCHEDE
    ========================= */

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MENU
    ========================= */

    #drinks,
    #food,
    #desserts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 74px;
      padding: 10px 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
    }

    .menu-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .menu-name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.15;
    }

    .menu-price {
      margin-top: 4px;
      font-size: 17px;
    }

    .menu-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .menu-btn,
    .qty-button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      background: #e5e5e5;
      font-size: 28px;
      font-weight: bold;
    }

    .menu-btn:active,
    .qty-button:active {
      transform: scale(0.94);
    }

    .menu-qty {
      min-width: 30px;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
    }


    /* =========================
       CONTO
    ========================= */

    .order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .order-row:last-child {
      border-bottom: 0;
    }

    .order-name {
      flex: 1;
      text-align: left;
      font-size: 18px;
      font-weight: bold;
    }

    .order-price {
      min-width: 75px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
    }


    /* =========================
       TOTALE
    ========================= */

    .total-card {
      margin-top: 22px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      font-size: 33px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MOBILE PICCOLO
    ========================= */

    @media (max-width: 390px) {

      body {
        padding: 8px;
      }

      .menu-name {
        font-size: 18px;
      }

      .menu-price {
        font-size: 16px;
      }

      .menu-btn,
      .qty-button {
        width: 44px;
        height: 44px;
        font-size: 25px;
      }

      .menu-controls {
        gap: 5px;
      }

      .menu-qty {
        min-width: 26px;
        font-size: 21px;
      }

    }



    /* =========================
       IPAD ORIZZONTALE - TAVOLO
    ========================= */

    @media (min-width: 900px) and (orientation: landscape) {
      body.table-open {
        overflow: hidden;
        padding: 8px;
      }

      .table-screen {
        width: 100%;
        max-width: none;
        height: calc(100vh - 16px);
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 8px;
      }

      .table-topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 8px 14px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      }

      .table-topbar h1 {
        margin: 0;
        text-align: left;
        font-size: 30px;
      }

      .covers-inline {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 20px;
        font-weight: bold;
      }

      .covers-inline .qty-button {
        width: 46px !important;
        height: 46px !important;
        font-size: 27px !important;
      }

      #coversDisplay {
        min-width: 38px !important;
        font-size: 29px !important;
      }

      .top-total {
        text-align: right;
        font-size: 27px;
        font-weight: bold;
      }

      .ipad-menu-grid {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .menu-column {
        min-width: 0;
        min-height: 0;
        padding: 8px;
        background: rgba(255,255,255,0.55);
        border-radius: 16px;
        overflow: hidden;
      }

      .menu-column h2 {
        margin: 0 0 6px 0;
        text-align: center;
        font-size: 22px;
      }

      .menu-column #drinks,
      .menu-column #food,
      .menu-column #desserts {
        gap: 5px;
      }

      .menu-column .menu-row {
        min-height: 44px;
        padding: 4px 7px;
        border-radius: 10px;
      }

      .menu-column .menu-name {
        font-size: 16px;
        line-height: 1.05;
      }

      .menu-column .menu-price {
        margin-top: 1px;
        font-size: 13px;
      }

      .menu-column .menu-controls {
        gap: 4px;
        margin-left: 4px;
      }

      .menu-column .menu-btn {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        font-size: 22px;
      }

      .menu-column .menu-qty {
        min-width: 23px;
        font-size: 18px;
      }

      .table-bottom-grid {
        display: grid;
        grid-template-columns: 1.05fr 1.25fr 0.9fr;
        gap: 8px;
        min-height: 150px;
        max-height: 175px;
      }

      .bottom-panel {
        min-width: 0;
        padding: 9px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      }

      .bottom-title {
        margin: 0 0 6px 0;
        font-size: 18px;
        font-weight: bold;
        text-align: left;
      }

      .extra-inline {
        display: grid;
        grid-template-columns: 1fr 105px auto;
        gap: 6px;
      }

      .extra-inline input {
        min-width: 0;
        padding: 9px !important;
        font-size: 16px !important;
      }

      .extra-inline button {
        padding: 8px 10px !important;
        font-size: 15px !important;
      }

      #order {
        max-height: 104px;
        overflow-y: auto;
        padding: 4px 8px;
        box-shadow: none;
      }

      #order .order-row {
        padding: 3px 0;
      }

      #order .order-name,
      #order .order-price {
        font-size: 14px;
      }

      #order button {
        min-height: 28px !important;
        padding: 3px 7px !important;
        font-size: 12px !important;
      }

      .split-actions {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 6px;
      }

      .split-compact {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 16px;
        font-weight: bold;
      }

      .split-compact .qty-button {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      #splitPeopleDisplay {
        min-width: 24px !important;
        font-size: 21px !important;
      }

      .split-total-compact {
        font-size: 18px;
        font-weight: bold;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        align-self: end;
      }

      .action-row button {
        width: 100%;
        min-height: 46px;
        margin: 0 !important;
        border: 0;
        border-radius: 11px;
        font-size: 16px;
        font-weight: bold;
      }
    }


    /* Riepilogo a tutta altezza nella colonna destra dell'iPad */
    @media (min-width: 900px) and (orientation: landscape) {
      .ipad-menu-grid { grid-template-columns: 1fr 1fr 1.25fr; }
      .ipad-center-stack { min-height:0; display:flex; flex-direction:column; gap:7px; overflow-y:auto; }
      .ipad-center-stack > .menu-column { flex:0 0 auto; overflow:visible; }
      .ipad-order-panel { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
      .ipad-order-panel #order { flex:1; max-height:none; min-height:0; overflow-y:auto; }
      .table-bottom-grid { grid-template-columns: 1fr 1fr; min-height:115px; max-height:140px; }
      .table-bottom-grid > .bottom-panel { min-height:0; }
      .table-bottom-grid .split-actions { grid-template-columns: 1fr 1fr; grid-template-rows:auto 1fr; align-items:center; }
      .table-bottom-grid .split-compact { grid-column:1; }
      .table-bottom-grid .split-total-compact { grid-column:2; }
      .table-bottom-grid .action-row { grid-column:1 / -1; }
    }

  </style>
</head>

  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://rpofronbpuchpjpmxzte.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KbANfO3ah9a4zhNyQCuJwg_CuJbGmTt";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       MENU
    ========================================= */

    let menu = [

      /* BEVANDE */

      {
        name: "Acqua grande",
        price: 2.50
      },

      {
        name: "Acqua piccola",
        price: 2.00
      },

      /* CUCINA */

      {
        name: "Primo",

      },

    async function loadMenuFromSupabase() {

  const { data, error } =
    await supabaseClient
      .from("ristoconti_menu")
      .select(
  "menu_key, name, price, category, active, sort_order"
)
      .eq("active", true)
      .order("sort_order", {
  ascending: true
});


  if (error) {

    console.error(
      "Errore caricamento menu:",
      error
    );

    return false;
  }


  if (!data || data.length === 0) {

    console.error(
      "Menu Supabase vuoto."
    );

    return false;
  }


  const dynamicMenu = [];


data.forEach(product => {

  const key =
    Number(product.menu_key);

  if (
    !Number.isInteger(key) ||
    key < 0
  ) {
    return;
  }


  dynamicMenu.push({

    name: product.name,

    price:
      Number(product.price),

    category:
      product.category,

    menu_key: key,

    sort_order:
      Number(product.sort_order || 0)

  });

});


menu = dynamicMenu;

      return true;

}


    /* =========================================
       VARIABILI
    ========================================= */

    const container =
      document.getElementById("tables");

    let currentTable = null;

    let order = {};

    let extras = [];

    let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
  "touchstart",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    touchStartX = touch.screenX;
    touchStartY = touch.screenY;
  },
  { passive: true }
);

document.addEventListener(
  "touchend",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    const distanceX =
      touch.screenX - touchStartX;

    const distanceY =
      Math.abs(
        touch.screenY - touchStartY
      );

    if (
      distanceX > 100 &&
      distanceX > distanceY * 1.5
    ) {

      location.reload();

    }
  },
  { passive: true }
);


/* =========================================
   CREA 40 TAVOLI CON STATO
========================================= */

async function renderTables() {

  container.innerHTML = "";

  const { data, error } =
    await supabaseClient
      .from("ristoconti_tables")
      .select(
        "table_number, covers, order_data, extras"
      )
      .order(
        "table_number",
        { ascending: true }
      );

  if (error) {

    console.error(
      "Errore caricamento tavoli:",
      error
    );

  }

  const tablesData = data || [];

  for (let i = 1; i <= 40; i++) {

    const savedTable =
      tablesData.find(
        table =>
          Number(table.table_number) === i
      );

    const covers =
      Number(savedTable?.covers || 0);

    const savedOrder =
      savedTable?.order_data || {};

    const savedExtras =
      Array.isArray(savedTable?.extras)
        ? savedTable.extras
        : [];

    const hasProducts =
      Object.values(savedOrder)
        .some(
          qty => Number(qty) > 0
        );

    const hasExtras =
      savedExtras.some(extra => {
        const amount =
          extra &&
          typeof extra === "object"
            ? Number(extra.amount || 0)
            : Number(extra || 0);
        return amount > 0;
      });

    const occupied =
      covers > 0 ||
      hasProducts ||
      hasExtras;

    let tableTotal =
  covers * 2;

Object.keys(savedOrder)
  .forEach(index => {

    const key =
      Number(index);

    const item =
      menu.find(
        product =>
          Number(product.menu_key) === key
      );

    const qty =
      Number(savedOrder[key] || 0);

    if (item && qty > 0) {

      tableTotal +=
        item.price * qty;

    }

  });

savedExtras.forEach(extra => {

  const amount =
    extra &&
    typeof extra === "object"
      ? Number(extra.amount || 0)
      : Number(extra || 0);

  tableTotal += amount;

});


    const button =
      document.createElement("button");


if (occupied) {

  button.style.background =
    "#bfe8c2";

  button.style.border =
    "2px solid #6aaa70";

  button.innerHTML = `
    <div
      style="
        font-size:21px;
        font-weight:bold;
      "
    >
      Tavolo ${i}
    </div>

    <div
      style="
        margin-top:6px;
        font-size:15px;
        font-weight:normal;
      "
    >
      ${covers}
      ${covers === 1 ? "coperto" : "coperti"}
    </div>

    <div
      style="
        margin-top:5px;
        font-size:22px;
        font-weight:bold;
      "
    >
      € ${tableTotal.toFixed(2)}
    </div>
  `;

}
    else {

      button.style.background =
        "#e8e8e8";

      button.style.border =
        "2px solid #d0d0d0";

      button.innerHTML = `
        <div>
          Tavolo ${i}
        </div>

        <div
          style="
            margin-top:6px;
            font-size:14px;
            font-weight:normal;
          "
        >
          Libero
        </div>
      `;

    }


    button.onclick = () => {
      openTable(i);
    };


    container.appendChild(button);

  }

}

async function startRistoConti() {

  await loadMenuFromSupabase();

  await renderTables();

}

startRistoConti();

    /* =========================================
       CARICA TAVOLO
    ========================================= */

    async function loadTableFromSupabase(
      tableNumber
    ) {

      const { data, error } =
        await supabaseClient
          .from("ristoconti_tables")
          .select(
            "covers, order_data, extras"
          )
          .eq(
            "table_number",
            tableNumber
          )
          .single();


      if (error) {

        console.error(
          "Errore caricamento tavolo:",
          error
        );

        return {
          covers: 0,
          order: {},
          extras: []
        };

      }


      return {

        covers:
          Number(data.covers || 0),

        order:
          data.order_data || {},

        extras:
          Array.isArray(data.extras)
            ? data.extras
            : []

      };

    }


    /* =========================================
       SALVA TAVOLO
    ========================================= */

    async function saveTableToSupabase() {

      if (!currentTable) {
        return;
      }


      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      const { error } =
        await supabaseClient
          .from("ristoconti_tables")
          .update({

            covers: covers,

            order_data: order,

            extras: extras,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "table_number",
            currentTable
          );


      if (error) {

        console.error(
          "Errore salvataggio tavolo:",
          error
        );

      }

    }


    /* =========================================
       APRI TAVOLO
    ========================================= */

          <div class="table-bottom-grid">

            <div class="bottom-panel">

              <div class="extra-inline">
                <input

                  placeholder="Descrizione, es. Pane"
                >

                <input

                >

                <button onclick="addExtra()">

              </div>
            </div>


            <div class="bottom-panel">

            <div class="bottom-panel split-actions">

                >

                <button

                >+</button>

              <div class="split-total-compact">

              </div>

              <div class="action-row">

                </button>

                <button

                >
                  Chiudi conto
                </button>
              </div>

      renderMenu();

      renderOrder();

    }


    /* =========================================
       TOGLI PRODOTTO
    ========================================= */

    function removeItem(index) {

      if (!order[index]) {
        return;
      }


      order[index]--;


      if (order[index] <= 0) {

        delete order[index];

      }


      renderMenu();

      renderOrder();

    function addExtra() {

  const descriptionInput =
    document.getElementById(
      "extraDescription"
    );

  const amountInput =
    document.getElementById(
      "extraAmount"
    );

  const description =
    descriptionInput.value.trim();

  const amount =
    Number(amountInput.value);

  if (!amount || amount <= 0) {
    return;
  }

  extras.push({
    description:
      description || "Altro",
    amount: amount
  });

  descriptionInput.value = "";
  amountInput.value = "";

  renderOrder();

}

    function removeExtra(index) {

      extras.splice(index, 1);

      renderOrder();

    }


    /* =========================================
       DIVIDI CONTO
    ========================================= */

    function changeSplit(amount) {

      const input =
        document.getElementById(
          "splitPeople"
        );

      const display =
        document.getElementById(
          "splitPeopleDisplay"
        );


      let people =
        Number(input.value || 1);


      people += amount;


      if (people < 1) {

        people = 1;

      }


      input.value = people;

      display.textContent = people;


      renderSplit();

    }


    function renderSplit() {

      const total =
        Number(
          document
            .getElementById("total")
            ?.textContent || 0
        );


      const people =
        Number(
          document
            .getElementById(
              "splitPeople"
            )
            ?.value || 1
        );


      const splitBox =
        document.getElementById(
          "splitTotal"
        );


      if (!splitBox) {
        return;
      }


      splitBox.textContent =
        (total / people).toFixed(2);

    }


    /* =========================================
       CONTO
    ========================================= */

    function renderOrder() {

      const orderBox =
        document.getElementById(
          "order"
        );

      const totalBox =
        document.getElementById(
          "total"
        );


      if (
        !orderBox ||
        !totalBox
      ) {

        return;

      }


      orderBox.innerHTML = "";


      let total = 0;


      /* COPERTI */

      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      if (covers > 0) {

        const coverTotal =
          covers * 2;


        total += coverTotal;


        orderBox.innerHTML += `

          <div class="order-row">

            <span class="order-name">

              Coperto × ${covers}

            </span>


            <strong class="order-price">

              €${coverTotal.toFixed(2)}

            </strong>

          </div>

        `;

      }


      /* PRODOTTI */

      Object.keys(order)
        .forEach((index) => {

          const key =
  Number(index);

const item =
  menu.find(
    product =>
      Number(product.menu_key) === key
  );

const qty =
  Number(order[key]);


          if (
            !item ||
            qty <= 0
          ) {

            return;

          }


          const subtotal =
            item.price * qty;


          total += subtotal;


          orderBox.innerHTML += `

            <div class="order-row">

              <span class="order-name">

                ${item.name} × ${qty}

              </span>


              <strong class="order-price">

                €${subtotal.toFixed(2)}

              </strong>

            </div>

          `;

        });


      /* ALTRO */

      extras.forEach(
  (extra, index) => {

    const isObject =
      extra &&
      typeof extra === "object";

    const amount =
      isObject
        ? Number(extra.amount || 0)
        : Number(extra || 0);

    const description =
      isObject
        ? String(
            extra.description || "Altro"
          )
        : "Altro";

    total += amount;

    orderBox.innerHTML += `

      <div class="order-row">

        <span class="order-name">
          ${description}
        </span>

        <button
          onclick="removeExtra(${index})"
          style="
            min-height:40px;
            border:0;
            border-radius:10px;
            padding:7px 10px;
            font-size:15px;
          "
        >
          Elimina
        </button>

        <strong class="order-price">
          €${amount.toFixed(2)}
        </strong>

      </div>

    `;

  }
);


      totalBox.textContent =
        total.toFixed(2);


      renderSplit();


      saveTableToSupabase();

    }

    window.exportDailyCSV = function() {

  const bills = window.dailyBills || [];

  if (bills.length === 0) {
    alert("Non ci sono conti chiusi da esportare oggi.");
    return;
  }

  const productNames = [];

  bills.forEach(bill => {
    let billItems = Array.isArray(bill.items) ? bill.items : [];

    // Compatibilità con i conti chiusi prima dell'aggiunta della colonna items.
    if (billItems.length === 0) {
      const oldOrder = bill.order_data || {};

      billItems = Object.keys(oldOrder)
        .map(key => {
          const menuKey = Number(key);
          const item = menu.find(
            product => Number(product.menu_key) === menuKey
          );
          const qty = Number(oldOrder[key] || 0);

          if (!item || qty <= 0) {
            return null;
          }

          return {
            name: item.name,
            qty: qty,
            unit_price: Number(item.price || 0),
            subtotal: Number(item.price || 0) * qty
          };
        })
        .filter(Boolean);
    }

    bill._exportItems = billItems;

    billItems.forEach(item => {
      const name = String(item.name || "").trim();

      if (name && !productNames.includes(name)) {
        productNames.push(name);
      }
    });
  });

  const rows = [
    [
      "Data e ora",
      "Tavolo",
      "Coperti",
      ...productNames,
      "Altro",
      "Totale"
    ]
  ];

  bills.forEach(bill => {
    const date = new Date(bill.closed_at)
      .toLocaleString("it-IT");

    const quantities = {};

    (bill._exportItems || []).forEach(item => {
      const name = String(item.name || "").trim();

      if (!name) {
        return;
      }

      quantities[name] =
        Number(quantities[name] || 0) +
        Number(item.qty || 0);
    });

    const extraText = (
      Array.isArray(bill.extras) ? bill.extras : []
    )
      .map(extra => {
        if (extra && typeof extra === "object") {
          const description =
            String(extra.description || "Altro");
          const amount =
            Number(extra.amount || 0);

          return `${description} € ${amount.toFixed(2)}`;
        }

        const amount = Number(extra || 0);
        return `Altro € ${amount.toFixed(2)}`;
      })
      .join(" | ");

    rows.push([
      date,
      bill.table_number,
      Number(bill.covers || 0),
      ...productNames.map(
        name => Number(quantities[name] || 0)
      ),
      extraText,
      Number(bill.total || 0)
        .toFixed(2)
        .replace(".", ",")
    ]);
  });

  const csv = rows
    .map(row =>
      row
        .map(value =>
          `"${String(value).replace(/"/g, '""')}"`
        )
        .join(";")
    )
    .join("\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const today = new Date()
    .toLocaleDateString("it-IT")
    .replace(/\//g, "-");

  link.href = url;
  link.download = `RistoConti_${today}.csv`;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
};

    window.closeBill = async function() {

  if (!currentTable) {
    alert("Nessun tavolo selezionato.");
    return;
  }

  const confirmed = confirm(
    "Chiudere il conto?\\n\\nVerranno cancellati coperti, prodotti e altri importi."
  );

  if (!confirmed) {
    return;
  }

  const tableToClose = currentTable;

  // Legge i coperti direttamente dalla schermata.
  const coversToSave = Number(
    document.getElementById("covers")?.value || 0
  );

  let totalToSave = coversToSave * 2;
  const itemsToSave = [];

  Object.keys(order).forEach(key => {
    const menuKey = Number(key);

    const item = menu.find(
      product =>
        Number(product.menu_key) === menuKey
    );

    const qty = Number(order[key] || 0);

    if (item && qty > 0) {
      const unitPrice = Number(item.price || 0);
      const subtotal = unitPrice * qty;

      totalToSave += subtotal;

      itemsToSave.push({
        menu_key: menuKey,
        name: item.name,
        qty: qty,
        unit_price: unitPrice,
        subtotal: subtotal
      });
    }
  });

  extras.forEach(extra => {
    const amount =
      extra && typeof extra === "object"
        ? Number(extra.amount || 0)
        : Number(extra || 0);

    totalToSave += amount;
  });

  const { error: historyError } =
    await supabaseClient
      .from("ristoconti_history")
      .insert({
        table_number: tableToClose,
        covers: coversToSave,
        order_data: order,
        items: itemsToSave,
        extras: extras,
        total: totalToSave
      });

  if (historyError) {
    console.error(historyError);

    alert(
      "Non sono riuscito a salvare il conto nello storico.\\n\\n" +
      "Il tavolo NON è stato cancellato.\\n\\n" +
      historyError.message
    );

    return;
  }

  const { error } =
    await supabaseClient
      .from("ristoconti_tables")
      .update({
        covers: 0,
        order_data: {},
        extras: [],
        updated_at: new Date().toISOString()
      })
      .eq("table_number", tableToClose);

  if (error) {
    console.error(error);

    alert(
      "Il conto è stato salvato nello storico, ma non sono riuscito a liberare il tavolo.\\n\\n" +
      error.message
    );

    return;
  }

  order = {};
  extras = [];

  alert("Conto chiuso. Tavolo liberato.");

  currentTable = null;
  location.reload();
};

    window.clearAllBills = async function() {

  const confirmed1 = confirm(
    "ATTENZIONE\n\nVuoi cancellare TUTTI i conti di tutti i tavoli?"
  );

  if (!confirmed1) {
    return;
  }

  const confirmed2 = confirm(
    "Sei sicuro?\n\nQuesta operazione azzererà tutti i 40 tavoli."
  );

  if (!confirmed2) {
    return;
  }

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })
    .gte("table_number", 1)
    .lte("table_number", 40);

  if (error) {

    console.error(error);

    alert(
      "Errore durante la cancellazione.\n\n" +
      error.message
    );

    return;
  }

  alert("Tutti i conti sono stati cancellati.");

  location.reload();
};
