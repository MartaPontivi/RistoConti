<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RistoConti</title>
  <style>
  * {
    box-sizing: border-box;
  }

  
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    text-align: center;
  }

  h1 {
    margin-bottom: 5px;
  }

  #tables {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 800px;
    margin: 25px auto;
  }

  #tables button {
    min-height: 75px;
    border: 0;
    border-radius: 12px;
    background: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  #tables button:active {
    transform: scale(0.97);
  }

  @media (max-width: 600px) {
    #tables {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>
  <h1>RistoConti</h1>
  <p>Seleziona un tavolo</p>

  <div id="tables"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<script>
  
  const container = document.getElementById("tables");

  const SUPABASE_URL = "https://rpofronbpuchpjpmxzte.supabase.co";
const SUPABASE_KEY = "sb_publishable_KbANfO3ah9a4zhNyQCuJwg_CuJbGmTt";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

  const menu = [
    { name: "Acqua grande", price: 2.50 },
    { name: "Acqua piccola", price: 2.00 },
    { name: "Bibita", price: 3.00 },
    { name: "Ichnusa", price: 4.50 },
    { name: "Moretti", price: 4.00 },
    { name: "Vino bottiglia", price: 12.00 },
    { name: "Vino 1/2", price: 9.00 },
    { name: "Vino 1/4", price: 5.00 },
    { name: "Prosecco", price: 18.00 },

    { name: "Primo", price: 10.00 },
    { name: "Secondo", price: 15.00 },
    { name: "Contorno", price: 4.00 },
    { name: "Pasta", price: 6.00 },

    { name: "Dolce", price: 4.00 },
    { name: "Caffè", price: 1.50 },
    { name: "Amaro", price: 3.00 }
  ];

  let order = {};
  let extras = [];

  let currentTable = null;

async function loadTableFromSupabase(tableNumber) {
  const { data, error } = await supabaseClient
    .from("ristoconti_tables")
    .select("covers, order_data, extras")
    .eq("table_number", tableNumber)
    .single();

  if (error) {
    console.error("Errore caricamento tavolo:", error);
    return {
      covers: 0,
      order: {},
      extras: []
    };
  }

  return {
    covers: data.covers || 0,
    order: data.order_data || {},
    extras: data.extras || []
  };
}

async function saveTableToSupabase() {
  if (!currentTable) return;

  const covers =
    Number(document.getElementById("covers")?.value || 0);

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: covers,
      order_data: order,
      extras: extras,
      updated_at: new Date().toISOString()
    })
    .eq("table_number", currentTable);

  if (error) {
    console.error("Errore salvataggio tavolo:", error);
  }
}

  for (let i = 1; i <= 40; i++) {
    const button = document.createElement("button");
    button.textContent = `Tavolo ${i}`;

    button.onclick = () => {
      openTable(i);
    };

    container.appendChild(button);
  }

  async function openTable(tableNumber) {
    currentTable = tableNumber;

const savedTable =
  await loadTableFromSupabase(tableNumber);

order = savedTable.order || {};
extras = savedTable.extras || [];

    document.body.innerHTML = `
      <div style="max-width:700px;margin:0 auto;padding:20px;">
        <h1 style="text-align:center;">Tavolo ${tableNumber}</h1>

        <div style="
  background:white;
  border-radius:16px;
  padding:16px;
  margin:15px 0 25px 0;
">

  <div style="
    font-size:24px;
    font-weight:bold;
    margin-bottom:12px;
  ">
    Coperti
  </div>

  <div style="
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
  ">

    <button
      onclick="changeCovers(-1)"
      style="
        width:65px;
        height:60px;
        border:0;
        border-radius:14px;
        background:#e5e5e5;
        font-size:32px;
        font-weight:bold;
      "
    >
      −
    </button>

    <div
      id="coversDisplay"
      style="
        min-width:70px;
        font-size:34px;
        font-weight:bold;
      "
    >
      ${savedTable.covers || 0}
    </div>

    <input
      id="covers"
      type="hidden"
      value="${savedTable.covers || 0}"
    >

    <button
      onclick="changeCovers(1)"
      style="
        width:65px;
        height:60px;
        border:0;
        border-radius:14px;
        background:#e5e5e5;
        font-size:32px;
        font-weight:bold;
      "
    >
      +
    </button>

  </div>
</div>

        <h2>Bevande</h2>
        <div id="drinks"></div>

        <h2>Cucina</h2>
        <div id="food"></div>

        <h2>Dolci e caffè</h2>
        <div id="desserts"></div>

        <h2>Altro</h2>

        <div style="display:flex;gap:8px;margin-bottom:20px;">
          <input
            id="extraAmount"
            type="number"
            step="0.01"
            min="0"
            placeholder="Importo"
            style="
              flex:1;
              padding:12px;
              font-size:18px;
            "
          >

          <button
            onclick="addExtra()"
            style="
              padding:12px 18px;
              font-size:18px;
              font-weight:bold;
            "
          >
            Aggiungi
          </button>
        </div>

        <h2>Conto</h2>

        <div id="order"></div>

        <h2>
          Totale: € <span id="total">0.00</span>
        </h2>
        <div style="
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:12px;
">
  <h2>Dividi conto</h2>

  <label>
    Numero persone:
  </label>

  <input
    id="splitPeople"
    type="number"
    min="1"
    value="2"
    oninput="renderSplit()"
    style="
      width:100%;
      padding:10px;
      font-size:18px;
      margin:8px 0;
    "
  >

  <div style="font-size:20px;font-weight:bold;">
    A persona: € <span id="splitTotal">0.00</span>
  </div>
</div>

        <button
          onclick="location.reload()"
          style="
            margin-top:20px;
            padding:12px 20px;
            font-size:18px;
          "
        >
          Indietro
        </button>
      </div>
    `;

    renderMenu();
    renderOrder();
  }

  function changeCovers(amount) {
  const input = document.getElementById("covers");
  const display = document.getElementById("coversDisplay");

  let covers = Number(input.value || 0);

  covers += amount;

  if (covers < 0) {
    covers = 0;
  }

  input.value = covers;
  display.textContent = covers;

  renderOrder();
}

  function renderMenu() {
    const drinks = document.getElementById("drinks");
    const food = document.getElementById("food");
    const desserts = document.getElementById("desserts");

    menu.forEach((item, index) => {
      const button = document.createElement("button");

      button.textContent =
        `${item.name} €${item.price.toFixed(2)}`;

      button.style.margin = "4px";
      button.style.padding = "10px";
      button.style.fontSize = "16px";

      button.onclick = () => {
        addItem(index);
      };

      if (index <= 8) {
        drinks.appendChild(button);
      } else if (index <= 12) {
        food.appendChild(button);
      } else {
        desserts.appendChild(button);
      }
    });
  }

  function addItem(index) {
    if (!order[index]) {
      order[index] = 0;
    }

    order[index]++;
    renderOrder();
  }

  function removeItem(index) {
    if (!order[index]) return;

    order[index]--;

    if (order[index] <= 0) {
      delete order[index];
    }

    renderOrder();
  }

  function addExtra() {
    const input = document.getElementById("extraAmount");
    const amount = Number(input.value);

    if (!amount || amount <= 0) {
      return;
    }

    extras.push(amount);

    input.value = "";
    renderOrder();
  }

  function removeExtra(index) {
    extras.splice(index, 1);
    renderOrder();
  }

  function renderOrder() {
    const orderBox = document.getElementById("order");
    const totalBox = document.getElementById("total");

    if (!orderBox || !totalBox) return;

    orderBox.innerHTML = "";

    let total = 0;

    const covers =
      Number(document.getElementById("covers")?.value || 0);

    if (covers > 0) {
      const coverTotal = covers * 2;

      total += coverTotal;

      orderBox.innerHTML += `
        <div style="
          display:flex;
          justify-content:space-between;
          padding:8px 0;
          border-bottom:1px solid #ddd;
        ">
          <span>Coperto × ${covers}</span>
          <strong>€${coverTotal.toFixed(2)}</strong>
        </div>
      `;
    }

    Object.keys(order).forEach((index) => {
      const item = menu[index];
      const qty = order[index];

      const subtotal = item.price * qty;

      total += subtotal;

      orderBox.innerHTML += `
        <div style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:10px;
          padding:8px 0;
          border-bottom:1px solid #ddd;
        ">
          <span style="flex:1;">
            ${item.name}
          </span>

          <button
            onclick="removeItem(${index})"
            style="width:38px;height:38px;font-size:20px;"
          >
            −
          </button>

          <strong>${qty}</strong>

          <button
            onclick="addItem(${index})"
            style="width:38px;height:38px;font-size:20px;"
          >
            +
          </button>

          <strong style="min-width:80px;text-align:right;">
            €${subtotal.toFixed(2)}
          </strong>
        </div>
      `;
    });

    extras.forEach((amount, index) => {
      total += amount;

      orderBox.innerHTML += `
        <div style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:10px;
          padding:8px 0;
          border-bottom:1px solid #ddd;
        ">
          <span style="flex:1;">
            Altro
          </span>

          <button
            onclick="removeExtra(${index})"
            style="padding:6px 10px;"
          >
            Elimina
          </button>

          <strong>
            €${amount.toFixed(2)}
          </strong>
        </div>
      `;
    });

    totalBox.textContent = total.toFixed(2);
renderSplit();
saveTableToSupabase();
  }
  function renderSplit() {
  const total =
    Number(document.getElementById("total")?.textContent || 0);

  const people =
    Number(document.getElementById("splitPeople")?.value || 1);

  const splitBox =
    document.getElementById("splitTotal");

  if (!splitBox) return;

  if (people <= 0) {
    splitBox.textContent = "0.00";
    return;
  }

  splitBox.textContent =
    (total / people).toFixed(2);
}
</script>
</body>
</html>
