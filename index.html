<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RistoConti</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    h2 {
      font-size: 27px;
      margin-top: 28px;
      margin-bottom: 12px;
      text-align: left;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =========================
       TAVOLI
    ========================= */

    #tables {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 700px;
      margin: 25px auto;
    }

    #tables button {
      min-height: 78px;
      border: 0;
      border-radius: 15px;
      background: white;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 2px 7px rgba(0,0,0,0.14);
    }

    #tables button:active {
      transform: scale(0.97);
    }


    /* =========================
       SCHEDE
    ========================= */

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MENU
    ========================= */

    #drinks,
    #food,
    #desserts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 74px;
      padding: 10px 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
    }

    .menu-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .menu-name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.15;
    }

    .menu-price {
      margin-top: 4px;
      font-size: 17px;
    }

    .menu-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .menu-btn,
    .qty-button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      background: #e5e5e5;
      font-size: 28px;
      font-weight: bold;
    }

    .menu-btn:active,
    .qty-button:active {
      transform: scale(0.94);
    }

    .menu-qty {
      min-width: 30px;
      text-align: center;
      font-size: 23px;
      font-weight: bold;
    }


    /* =========================
       CONTO
    ========================= */

    .order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .order-row:last-child {
      border-bottom: 0;
    }

    .order-name {
      flex: 1;
      text-align: left;
      font-size: 18px;
      font-weight: bold;
    }

    .order-price {
      min-width: 75px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
    }


    /* =========================
       TOTALE
    ========================= */

    .total-card {
      margin-top: 22px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      font-size: 33px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }


    /* =========================
       MOBILE PICCOLO
    ========================= */

    @media (max-width: 390px) {

      body {
        padding: 8px;
      }

      .menu-name {
        font-size: 18px;
      }

      .menu-price {
        font-size: 16px;
      }

      .menu-btn,
      .qty-button {
        width: 44px;
        height: 44px;
        font-size: 25px;
      }

      .menu-controls {
        gap: 5px;
      }

      .menu-qty {
        min-width: 26px;
        font-size: 21px;
      }

    }

  </style>
</head>


<body>

  <!-- SUPABASE -->

  <script>

    /* =========================================

    const SUPABASE_URL =
      "https://rpofronbpuchpjpmxzte.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_KbANfO3ah9a4zhNyQCuJwg_CuJbGmTt";

    const supabaseClient =
      supabase.createClient(

      );


    /* =========================================
       MENU
    ========================================= */

    const menu = [

    /* =========================================
       VARIABILI
    ========================================= */

    const container =
      document.getElementById("tables");

    let currentTable = null;

    let order = {};

    let extras = [];

    let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
  "touchstart",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    touchStartX = touch.screenX;
    touchStartY = touch.screenY;
  },
  { passive: true }
);

document.addEventListener(
  "touchend",
  function(event) {

    if (!currentTable) {
      return;
    }

    const touch = event.changedTouches[0];

    const distanceX =
      touch.screenX - touchStartX;

    const distanceY =
      Math.abs(
        touch.screenY - touchStartY
      );

    if (
      distanceX > 100 &&
      distanceX > distanceY * 1.5
    ) {

      location.reload();

    }
  },
  { passive: true }
);


    /* =========================================
       CREA 40 TAVOLI
    ========================================= */

    for (let i = 1; i <= 40; i++) {

      const button =
        document.createElement("button");

      button.textContent =
        `Tavolo ${i}`;

      button.onclick = () => {
        openTable(i);
      };

      container.appendChild(button);

    }


    /* =========================================
       CARICA TAVOLO
    ========================================= */

    async function loadTableFromSupabase(
      tableNumber
    ) {

      const { data, error } =
        await supabaseClient
          .from("ristoconti_tables")
          .select(
            "covers, order_data, extras"
          )
          .eq(
            "table_number",
            tableNumber
          )
          .single();


      if (error) {

        console.error(
          "Errore caricamento tavolo:",
          error
        );

        return {
          covers: 0,
          order: {},
          extras: []
        };

      }


      return {

        covers:
          Number(data.covers || 0),

        order:
          data.order_data || {},

        extras:
          Array.isArray(data.extras)
            ? data.extras
            : []

      };

    }


    /* =========================================
       SALVA TAVOLO
    ========================================= */

    async function saveTableToSupabase() {

      if (!currentTable) {
        return;
      }


      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      const { error } =
        await supabaseClient
          .from("ristoconti_tables")
          .update({

            covers: covers,

            order_data: order,

            extras: extras,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "table_number",
            currentTable
          );


      if (error) {

        console.error(
          "Errore salvataggio tavolo:",
          error
        );

      }

    }


    /* =========================================
       APRI TAVOLO
    ========================================= */

    async function openTable(tableNumber) {

      currentTable = tableNumber;


      const savedTable =
        await loadTableFromSupabase(
          tableNumber
        );


      order =
        savedTable.order || {};

      extras =
        savedTable.extras || [];


      document.body.innerHTML = `

        <div
          style="
            max-width:700px;
            margin:0 auto;
            padding:3px;
          "
        >

          <h1>
            Tavolo ${tableNumber}
          </h1>


          <!-- COPERTI -->

          <div
            class="card"
            style="
              margin:18px 0 25px 0;
            "
          >

            <div
              style="
                font-size:25px;
                font-weight:bold;
                margin-bottom:14px;
              "
            >
              Coperti
            </div>


            <div
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                gap:18px;
              "
            >

              <button
                class="qty-button"
                onclick="changeCovers(-1)"
                style="
                  width:64px;
                  height:58px;
                  font-size:32px;
                "
              >
                −
              </button>


              <div
                id="coversDisplay"
                style="
                  min-width:65px;
                  font-size:36px;
                  font-weight:bold;
                "
              >
                ${savedTable.covers || 0}
              </div>


              <input
                id="covers"
                type="hidden"
                value="${savedTable.covers || 0}"
              >


              <button
                class="qty-button"
                onclick="changeCovers(1)"
                style="
                  width:64px;
                  height:58px;
                  font-size:32px;
                "
              >
                +
              </button>

            </div>

          </div>


          <!-- BEVANDE -->

          <h2>Bevande</h2>

          <div id="drinks"></div>


          <!-- CUCINA -->

          <h2>Cucina</h2>

          <div id="food"></div>


          <!-- DOLCI -->

          <h2>Dolci e caffè</h2>

          <div id="desserts"></div>


          <!-- ALTRO -->

          <h2>Altro</h2>


          <div
            class="card"
            style="
              display:flex;
              gap:8px;
            "
          >

            <input
              id="extraAmount"
              type="number"
              inputmode="decimal"
              step="0.01"
              min="0"
              placeholder="€ Importo"
              style="
                width:100%;
                min-width:0;
                padding:14px;
                border:1px solid #aaa;
                border-radius:12px;
                font-size:21px;
              "
            >


            <button
              onclick="addExtra()"
              style="
                border:0;
                border-radius:12px;
                padding:12px 15px;
                font-size:18px;
                font-weight:bold;
              "
            >
              Aggiungi
            </button>

          </div>


          <!-- CONTO -->

          <h2>Conto</h2>


          <div
            id="order"
            class="card"
          ></div>


          <!-- TOTALE -->

          <div class="total-card">

            Totale:
            € <span id="total">0.00</span>

          </div>


          <!-- DIVIDI CONTO -->

          <div
            class="card"
            style="
              margin-top:22px;
            "
          >

            <h2
              style="
                margin-top:0;
                text-align:center;
              "
            >
              Dividi conto
            </h2>


            <div
              style="
                font-size:19px;
                font-weight:bold;
              "
            >
              Numero persone
            </div>


            <div
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                gap:15px;
                margin:14px 0;
              "
            >

              <button
                onclick="changeSplit(-1)"
                class="qty-button"
              >
                −
              </button>


              <div
                id="splitPeopleDisplay"
                style="
                  min-width:55px;
                  font-size:30px;
                  font-weight:bold;
                "
              >
                2
              </div>


              <input
                id="splitPeople"
                type="hidden"
                value="2"
              >


              <button
                onclick="changeSplit(1)"
                class="qty-button"
              >
                +
              </button>

            </div>


            <div
              style="
                margin-top:15px;
                font-size:26px;
                font-weight:bold;
              "
            >

              A persona:

              € <span id="splitTotal">0.00</span>

            </div>

          </div>

<button
  onclick="closeBill()"
  style="
    width:100%;
    min-height:62px;
    margin-top:25px;
    border:0;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:21px;
    font-weight:bold;
  "
>
  Chiudi conto
</button>

          <!-- INDIETRO -->

          <button
            onclick="location.reload()"
            style="
              width:100%;
              min-height:60px;
              margin-top:25px;
              border:0;
              border-radius:14px;
              background:#ddd;
              font-size:21px;
              font-weight:bold;
            "
          >
            ← Indietro
          </button>


        </div>

      `;


      renderMenu();

      async function closeBill() {

  if (!currentTable) {
    return;
  }

  const confirmed = confirm(
    "Chiudere il conto e cancellare tutti i dati del tavolo?"
  );

  if (!confirmed) {
    return;
  }

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })
    .eq("table_number", currentTable);

  if (error) {
    console.error(
      "Errore chiusura conto:",
      error
    );

    alert(
      "Errore durante la chiusura del conto."
    );

    return;
  }

  order = {};
  extras = [];
  currentTable = null;

  location.reload();
}

      renderOrder();

    }


    /* =========================================
       COPERTI
    ========================================= */

    function changeCovers(amount) {

      const input =
        document.getElementById(
          "covers"
        );

      const display =
        document.getElementById(
          "coversDisplay"
        );


      let covers =
        Number(input.value || 0);


      covers += amount;


      if (covers < 0) {
        covers = 0;
      }


      input.value = covers;

      display.textContent = covers;


      renderOrder();

    }


    /* =========================================
       MENU A RIGHE
    ========================================= */

    function renderMenu() {

      const drinks =
        document.getElementById(
          "drinks"
        );

      const food =
        document.getElementById(
          "food"
        );

      const desserts =
        document.getElementById(
          "desserts"
        );


      drinks.innerHTML = "";

      food.innerHTML = "";

      desserts.innerHTML = "";


      menu.forEach(
        (item, index) => {

          const qty =
            Number(order[index] || 0);


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "menu-row";

          let backgroundColor = "#ffffff";

if (
  item.name === "Acqua grande" ||
  item.name === "Acqua piccola"
) {
  backgroundColor = "#bfe7ff";
}

else if (item.name === "Bibita") {
  backgroundColor = "#bfe8c2";
}

else if (
  item.name === "Ichnusa" ||
  item.name === "Moretti"
) {
  backgroundColor = "#fff0a6";
}

else if (
  item.name === "Vino bottiglia" ||
  item.name === "Vino 1/2" ||
  item.name === "Vino 1/4" ||
  item.name === "Prosecco"
) {
  backgroundColor = "#dfc5f5";
}

else if (
  item.name === "Primo" ||
  item.name === "Pasta"
) {
  backgroundColor = "#ffd6a3";
}

else if (item.name === "Secondo") {
  backgroundColor = "#ffc1bd";
}

else if (item.name === "Contorno") {
  backgroundColor = "#d8efb5";
}

else if (item.name === "Dolce") {
  backgroundColor = "#ffd1e3";
}

else if (item.name === "Caffè") {
  backgroundColor = "#dfc2a5";
}

else if (item.name === "Amaro") {
  backgroundColor = "#f2d18b";
}

row.style.backgroundColor =
  backgroundColor;


          row.innerHTML = `

            <div class="menu-info">

              <div class="menu-name">
                ${item.name}
              </div>

              <div class="menu-price">
                € ${item.price.toFixed(2)}
              </div>

            </div>


            <div class="menu-controls">

              <button
                class="menu-btn"
                onclick="removeItem(${index})"
              >
                −
              </button>


              <div class="menu-qty">
                ${qty}
              </div>


              <button
                class="menu-btn"
                onclick="addItem(${index})"
              >
                +
              </button>

            </div>

          `;


          if (index <= 8) {

            drinks.appendChild(row);

          }

          else if (index <= 12) {

            food.appendChild(row);

          }

          else {

            desserts.appendChild(row);

          }

        }
      );

    }


    /* =========================================
       AGGIUNGI PRODOTTO
    ========================================= */

    function addItem(index) {

      if (!order[index]) {

        order[index] = 0;

      }


      order[index]++;


      renderMenu();

      renderOrder();

    }


    /* =========================================
       TOGLI PRODOTTO
    ========================================= */

    function removeItem(index) {

      if (!order[index]) {
        return;
      }


      order[index]--;


      if (order[index] <= 0) {

        delete order[index];

      }


      renderMenu();

      renderOrder();

    }


    /* =========================================
       ALTRO
    ========================================= */

    function addExtra() {

      const input =
        document.getElementById(
          "extraAmount"
        );


      const amount =
        Number(input.value);


      if (
        !amount ||
        amount <= 0
      ) {

        return;

      }


      extras.push(amount);


      input.value = "";


      renderOrder();

    }


    function removeExtra(index) {

      extras.splice(index, 1);

      renderOrder();

    }


    /* =========================================
       DIVIDI CONTO
    ========================================= */

    function changeSplit(amount) {

      const input =
        document.getElementById(
          "splitPeople"
        );

      const display =
        document.getElementById(
          "splitPeopleDisplay"
        );


      let people =
        Number(input.value || 1);


      people += amount;


      if (people < 1) {

        people = 1;

      }


      input.value = people;

      display.textContent = people;


      renderSplit();

    }


    function renderSplit() {

      const total =
        Number(
          document
            .getElementById("total")
            ?.textContent || 0
        );


      const people =
        Number(
          document
            .getElementById(
              "splitPeople"
            )
            ?.value || 1
        );


      const splitBox =
        document.getElementById(
          "splitTotal"
        );


      if (!splitBox) {
        return;
      }


      splitBox.textContent =
        (total / people).toFixed(2);

    }


    /* =========================================
       CONTO
    ========================================= */

    function renderOrder() {

      const orderBox =
        document.getElementById(
          "order"
        );

      const totalBox =
        document.getElementById(
          "total"
        );


      if (
        !orderBox ||
        !totalBox
      ) {

        return;

      }


      orderBox.innerHTML = "";


      let total = 0;


      /* COPERTI */

      const covers =
        Number(
          document
            .getElementById("covers")
            ?.value || 0
        );


      if (covers > 0) {

        const coverTotal =
          covers * 2;


        total += coverTotal;


        orderBox.innerHTML += `

          <div class="order-row">

            <span class="order-name">

              Coperto × ${covers}

            </span>


            <strong class="order-price">

              €${coverTotal.toFixed(2)}

            </strong>

          </div>

        `;

      }


      /* PRODOTTI */

      Object.keys(order)
        .forEach((index) => {

          const item =
            menu[index];

          const qty =
            Number(order[index]);


          if (
            !item ||
            qty <= 0
          ) {

            return;

          }


          const subtotal =
            item.price * qty;


          total += subtotal;


          orderBox.innerHTML += `

            <div class="order-row">

              <span class="order-name">

                ${item.name} × ${qty}

              </span>


              <strong class="order-price">

                €${subtotal.toFixed(2)}

              </strong>

            </div>

          `;

        });


      /* ALTRO */

      extras.forEach(
        (amount, index) => {

          amount =
            Number(amount);


          total += amount;


          orderBox.innerHTML += `

            <div class="order-row">

              <span class="order-name">
                Altro
              </span>


              <button
                onclick="removeExtra(${index})"
                style="
                  min-height:40px;
                  border:0;
                  border-radius:10px;
                  padding:7px 10px;
                  font-size:15px;
                "
              >
                Elimina
              </button>


              <strong class="order-price">

                €${amount.toFixed(2)}

              </strong>

            </div>

          `;

        });


      totalBox.textContent =
        total.toFixed(2);


      renderSplit();


      saveTableToSupabase();

    }

    window.closeBill = async function() {

  if (!currentTable) {
    alert("Nessun tavolo selezionato.");
    return;
  }

  const confirmed = confirm(
    "Chiudere il conto?\n\nVerranno cancellati coperti, prodotti e altri importi."
  );

  if (!confirmed) {
    return;
  }

  const tableToClose = currentTable;

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })
    .eq("table_number", tableToClose);

  if (error) {

    console.error(error);

    alert(
      "Non sono riuscito a chiudere il conto.\n\n" +
      error.message
    );

    return;
  }

  order = {};
  extras = [];

  alert("Conto chiuso. Tavolo liberato.");

  currentTable = null;

  location.reload();
};

    window.clearAllBills = async function() {

  const confirmed1 = confirm(
    "ATTENZIONE\n\nVuoi cancellare TUTTI i conti di tutti i tavoli?"
  );

  if (!confirmed1) {
    return;
  }

  const confirmed2 = confirm(
    "Sei sicuro?\n\nQuesta operazione azzererà tutti i 40 tavoli."
  );

  if (!confirmed2) {
    return;
  }

  const { error } = await supabaseClient
    .from("ristoconti_tables")
    .update({
      covers: 0,
      order_data: {},
      extras: [],
      updated_at: new Date().toISOString()
    })
    .gte("table_number", 1)
    .lte("table_number", 40);

  if (error) {

    console.error(error);

    alert(
      "Errore durante la cancellazione.\n\n" +
      error.message
    );

    return;
  }

  alert("Tutti i conti sono stati cancellati.");

  location.reload();
};
